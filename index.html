<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1f6b78">
  <title>Lügen</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- WICHTIG: "black-translucent" hat auf manchen iPhones einen bekannten WebKit-Bug: die
       Web-Ansicht ist dann kuerzer als der Bildschirm (genau um die Hoehe der Statusleiste),
       und der fehlende Streifen unten laesst sich mit keiner CSS-Hoehe erreichen, egal was man
       versucht (siehe tuneSafeBottom/syncBodyBg in app.js, waren nur Kaschierungsversuche).
       "black" beseitigt den Bug an der Wurzel: die Statusleiste wird ein blickdichter Balken,
       dafuer stimmt die Fensterhoehe dann exakt mit dem Bildschirm ueberein, kein Rest bleibt. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Lügen">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,700;0,800;1,800&display=swap" rel="stylesheet">

</head>

  <script src="app.js"></script>
</body>
